name: "Pipeline 1 - Infraestructura (Terraform)"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción de Terraform a ejecutar'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - plan
          - destroy

permissions:
  id-token: write
  contents: read
  actions: write

env:
  AWS_REGION: "us-east-2"
  TF_WORKING_DIR: "terraform"
  PROJECT_NAME: "todo-list-devops"

jobs:
  terraform:
    name: "Aprovisionamiento de Infraestructura"
    runs-on: ubuntu-latest

    steps:
      - name: "1. Descargar Código Fuente"
        uses: actions/checkout@v4

      - name: "2. Configurar Credenciales de AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Opcional (si es AWS Academy)
          aws-region: ${{ env.AWS_REGION }}

      - name: "3. Instalar Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: "4. Restaurar Estado de Terraform (Cache de GitHub)"
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.TF_WORKING_DIR }}/terraform.tfstate
            ${{ env.TF_WORKING_DIR }}/terraform.tfstate.backup
          key: tfstate-${{ github.run_id }}
          restore-keys: |
            tfstate-

      - name: "5. Verificar Formato (fmt)"
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check

      - name: "6. Inicializar Terraform (init)"
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: "7. Validar Sintaxis (validate)"
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate -no-color

      - name: "7b. Sincronizar Recursos Huérfanos de AWS"
        if: ${{ github.event_name == 'push' || github.event.inputs.action == 'apply' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "Verificando si existen recursos huérfanos fuera del estado de Terraform..."

          in_state() {
            terraform state list "$1" >/dev/null 2>&1
          }

          # 1. Target Groups (si existen fuera del estado, se eliminan para recrearlos en la VPC actual)
          for tg in "${{ env.PROJECT_NAME }}-tg-frontend" "${{ env.PROJECT_NAME }}-tg-backend"; do
            res_tg=$([ "$tg" = "${{ env.PROJECT_NAME }}-tg-frontend" ] && echo frontend || echo backend)
            if ! in_state "aws_lb_target_group.$res_tg"; then
              TG_ARN=$(aws elbv2 describe-target-groups --names "$tg" --query "TargetGroups[0].TargetGroupArn" --output text 2>/dev/null || true)
              if [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
                echo "Eliminando Target Group huérfano fuera de estado: $tg"
                aws elbv2 delete-target-group --target-group-arn "$TG_ARN" || true
              fi
            fi
          done

          # 2. Repositorios ECR (si existen fuera del estado, los importamos)
          for repo in "${{ env.PROJECT_NAME }}-backend" "${{ env.PROJECT_NAME }}-frontend"; do
            res_repo=$([ "$repo" = "${{ env.PROJECT_NAME }}-backend" ] && echo backend || echo frontend)
            if ! in_state "aws_ecr_repository.$res_repo"; then
              if aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1; then
                echo "Importando repositorio ECR existente al estado: $repo"
                terraform import "aws_ecr_repository.$res_repo" "$repo" || true
              fi
            fi
          done

          # 3. Grupos de Logs de CloudWatch (si existen fuera del estado, los importamos)
          for lg in "/ecs/${{ env.PROJECT_NAME }}-backend" "/ecs/${{ env.PROJECT_NAME }}-frontend"; do
            res_lg=$([ "$lg" = "/ecs/${{ env.PROJECT_NAME }}-backend" ] && echo backend || echo frontend)
            if ! in_state "aws_cloudwatch_log_group.$res_lg"; then
              if aws logs describe-log-groups --log-group-name-prefix "$lg" --query "logGroups[?logGroupName=='$lg'].logGroupName" --output text 2>/dev/null | grep -q "$lg"; then
                echo "Importando grupo de logs existente: $lg"
                terraform import "aws_cloudwatch_log_group.$res_lg" "$lg" || true
              fi
            fi
          done

          # 4. Roles IAM (si existen fuera del estado, los importamos)
          if ! in_state "aws_iam_role.ecs_execution[0]"; then
            if aws iam get-role --role-name "${{ env.PROJECT_NAME }}-ecs-execution-role" >/dev/null 2>&1; then
              echo "Importando rol IAM existente: ${{ env.PROJECT_NAME }}-ecs-execution-role"
              terraform import 'aws_iam_role.ecs_execution[0]' "${{ env.PROJECT_NAME }}-ecs-execution-role" || true
              terraform import 'aws_iam_role_policy_attachment.ecs_execution_standard[0]' "${{ env.PROJECT_NAME }}-ecs-execution-role/arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy" || true
            fi
          fi

          if ! in_state "aws_iam_role.ecs_task[0]"; then
            if aws iam get-role --role-name "${{ env.PROJECT_NAME }}-ecs-task-role" >/dev/null 2>&1; then
              echo "Importando rol IAM existente: ${{ env.PROJECT_NAME }}-ecs-task-role"
              terraform import 'aws_iam_role.ecs_task[0]' "${{ env.PROJECT_NAME }}-ecs-task-role" || true
            fi
          fi

          echo "Sincronización de recursos completada."

      - name: "8. Generar Plan de Creación (plan)"
        if: ${{ github.event_name == 'push' || github.event.inputs.action == 'apply' || github.event.inputs.action == 'plan' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color -out=tfplan

      - name: "9. Aplicar Cambios (apply)"
        if: ${{ github.event_name == 'push' || github.event.inputs.action == 'apply' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -no-color -auto-approve tfplan

      - name: "10. Destruir Infraestructura (destroy)"
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "Drenando y deteniendo tareas ECS para liberar ENIs rápidamente..."
          aws ecs update-service --cluster ${{ env.PROJECT_NAME }}-cluster --service ${{ env.PROJECT_NAME }}-backend-service --desired-count 0 2>/dev/null || true
          aws ecs update-service --cluster ${{ env.PROJECT_NAME }}-cluster --service ${{ env.PROJECT_NAME }}-frontend-service --desired-count 0 2>/dev/null || true
          
          TASKS=$(aws ecs list-tasks --cluster ${{ env.PROJECT_NAME }}-cluster --query "taskArns[]" --output text 2>/dev/null || true)
          for task in $TASKS; do
            [ "$task" != "None" ] && aws ecs stop-task --cluster ${{ env.PROJECT_NAME }}-cluster --task "$task" --reason "Destroying Infra" 2>/dev/null || true
          done

          echo "Ejecutando terraform destroy..."
          terraform destroy -no-color -auto-approve

      - name: "11. Guardar Estado de Terraform (Cache de GitHub)"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.TF_WORKING_DIR }}/terraform.tfstate
            ${{ env.TF_WORKING_DIR }}/terraform.tfstate.backup
          key: tfstate-${{ github.run_id }}

      - name: "12. Respaldar Estado como Artefacto de GitHub"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-${{ github.run_id }}
          path: |
            ${{ env.TF_WORKING_DIR }}/terraform.tfstate
            ${{ env.TF_WORKING_DIR }}/terraform.tfstate.backup
          retention-days: 30

      - name: "13. Publicar Outputs en el Resumen del Job"
        if: ${{ (github.event_name == 'push' || github.event.inputs.action == 'apply') && success() }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "### 🚀 Infraestructura Aprovisionada con Éxito" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          terraform output >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
